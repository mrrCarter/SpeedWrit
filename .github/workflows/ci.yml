name: ci

# Every PR and every push to main: a clean install, then typecheck and the full test suite of all
# three packages on Linux. The job-send and job-send-app suites start their own embedded Postgres.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install
        run: npx -y npm@11.6.1 ci --ignore-scripts --no-audit --no-fund
      - name: typecheck
        run: npx -y npm@11.6.1 run typecheck
      - name: test
        run: npx -y npm@11.6.1 test
      - name: measurement report tests
        run: node --test scripts/measurement-report.test.mjs

  # The repo is public: every commit a PR brings must carry a GitHub noreply address as author and
  # committer, never a personal email. Only commit ids are printed, never the addresses.
  commit-identity:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: commits use a noreply email
        # shell: bash adds -o pipefail, so a failing git log fails the job instead of yielding an empty, passing list.
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=$(git log --format='%h %ae %ce' "$BASE..$HEAD" | awk '$2 !~ /@users\.noreply\.github\.com$|^noreply@github\.com$/ || $3 !~ /@users\.noreply\.github\.com$|^noreply@github\.com$/ {print $1}')
          if [ -n "$bad" ]; then
            echo "::error::these commits carry a non-noreply author or committer email; re-author them with your GitHub noreply address:"
            echo "$bad"
            exit 1
          fi
          echo "all commits in $BASE..$HEAD use a noreply email"
